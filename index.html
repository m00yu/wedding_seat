<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EE">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="2026.11.28 정훈 ♥ 현수 결혼식 · 자리 안내">
<meta property="og:title" content="정훈 ♥ 현수 · 자리 안내">
<meta property="og:description" content="성함을 입력하면 내 자리를 찾아드려요">
<title>정훈 ♥ 현수 · 자리 안내</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root{
    --paper:#FBF7EE; --paper-2:#F4EDDD; --ground:#EDE7D8;
    --ink:#2E2B24; --ink-soft:#5B5749; --ink-faint:#8A836E;
    --gold:#A98A54; --line:#D9CFB6; --shadow:rgba(46,43,36,.18);
    --rose:#B5544A;
    --c1:#B0644E; --c2:#4B7A8E; --c3:#5F8A4C;
    --z1:#F3DDD3; --z2:#C9D8DE; --z32:#CFE3CC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--ground);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;}
  button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;}
  input{font:inherit;}
  #app{max-width:430px;margin:0 auto;height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px -12px var(--shadow);overflow:hidden;}
  #view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 22px 24px;-webkit-overflow-scrolling:touch;}
  .tabbar{flex:none;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-faint);}
  .tab i{font-style:normal;font-size:17px;line-height:1;}
  .tab.on{color:var(--gold);font-weight:500;}
  .callbar{flex:none;padding:8px 16px 10px;background:var(--paper);}

  .serif{font-family:'Noto Serif KR',serif;}
  .eyebrow{margin:0 0 8px;font-size:10px;font-weight:500;letter-spacing:.34em;color:var(--gold);text-align:center;}
  .names{margin:0;font-family:'Noto Serif KR',serif;font-weight:400;font-size:30px;letter-spacing:.04em;text-align:center;}
  .names .heart{font-size:.44em;color:var(--rose);vertical-align:.3em;margin-inline:.16em;}
  .date{margin:10px 0 0;font-family:'Noto Serif KR',serif;font-size:14px;letter-spacing:.08em;color:var(--ink-soft);text-align:center;}
  .h2{font-family:'Noto Serif KR',serif;font-weight:500;font-size:19px;margin:4px 0 6px;}
  .lead{margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .rule{border:none;border-top:1px solid var(--line);margin:22px 0;}

  /* 홈 */
  .field{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:13px 14px;}
  .field input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:17px;color:var(--ink);}
  .field input::placeholder{color:var(--ink-faint);}
  .field .x{color:var(--ink-faint);font-size:17px;padding:0 2px;}
  .btn{display:block;width:100%;margin-top:10px;background:var(--ink);color:var(--paper);text-align:center;border-radius:12px;padding:14px;font-size:15px;letter-spacing:.06em;}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .menu button{text-align:left;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px 14px;font-size:13px;line-height:1.5;}
  .menu b{display:block;font-family:'Noto Serif KR',serif;font-weight:500;font-size:15.5px;margin-bottom:2px;}
  .menu span{color:var(--ink-faint);font-size:12px;}
  .sugg{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .sugg button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:15px 16px;font-size:17px;border-bottom:1px solid var(--line);text-align:left;}
  .sugg button:last-child{border:none;}
  .sugg em{font-style:normal;color:var(--gold);font-weight:500;}
  .sugg small{color:var(--ink-faint);font-size:12.5px;}
  .help{margin-top:20px;font-size:13.5px;line-height:1.85;color:var(--ink-soft);text-align:center;}
  .help a{color:var(--ink-soft);}

  /* 결과 */
  .greet{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:500;margin:6px 0 4px;letter-spacing:.01em;}
  .zone{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:500;line-height:1.5;margin:0 0 14px;}
  .mapwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:8px;}
  .mapwrap svg{display:block;width:100%;height:auto;}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-soft);margin:4px 2px 14px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:11px;height:11px;border-radius:3px;border:1px solid;display:inline-block;}
  .tapnote{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper-2);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;}
  .tapnote .finger{font-size:22px;color:var(--gold);}
  .tapnote b{font-family:'Noto Serif KR',serif;font-weight:500;}
  .link{display:block;margin:16px auto 0;font-size:13.5px;color:var(--ink-faint);text-decoration:underline;text-underline-offset:3px;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .hl{animation:pulse 1.8s ease-in-out infinite;}
  .path{animation:dash 1.2s linear infinite;}
  .tbl-hit{cursor:pointer;}

  /* 테이블 */
  .back{font-size:13.5px;color:var(--ink-faint);margin-bottom:8px;}
  .thead{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .badge{font-family:'Noto Serif KR',serif;font-weight:500;font-size:13px;border-radius:999px;padding:4px 11px;white-space:nowrap;}
  .badge.s1{background:var(--z1);color:var(--c1);} .badge.s2{background:var(--z2);color:var(--c2);} .badge.s3{background:var(--z32);color:var(--c3);}
  .thead h2{margin:0;font-family:'Noto Serif KR',serif;font-weight:500;font-size:17px;}
  .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin:10px 0 0;}
  .tbl{display:grid;grid-template-columns:1fr 30px 1fr;gap:5px;margin:6px 0 6px;}
  .seats{display:flex;flex-direction:column;gap:4px;}
  .seat{height:34px;border-radius:7px;font-size:15px;display:flex;align-items:center;padding:0 9px;background:#fff;border:1px solid var(--line);white-space:nowrap;width:100%;text-align:left;}
  .seats.l .seat{justify-content:flex-end;}
  .seat.empty{border-style:dashed;color:#CFC6AE;background:transparent;font-size:12px;}
  .seat.me{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:500;}
  .seat.sel{border:2px solid var(--rose);}
  .bar{background:var(--z2);border:1px solid #9DB3BC;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .bar span{writing-mode:vertical-rl;font-size:11px;letter-spacing:.3em;color:#3d5560;}
  /* 가로 테이블 */
  .hrow{display:grid;gap:4px;margin:4px 0;}
  .hrow .seat{height:auto;min-height:42px;justify-content:center;padding:4px 2px;font-size:14px;text-align:center;white-space:normal;word-break:keep-all;line-height:1.25;}
  .hbar{height:26px;border-radius:6px;background:var(--z32);border:1px solid #A9C7A4;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.3em;color:#41552f;margin:2px 0;}
  .dim{position:fixed;inset:0;background:rgba(46,43,36,.45);z-index:20;}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:21;}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}
  .who{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:500;margin:0;}
  .rel{margin:4px 0 16px;font-size:15.5px;color:var(--rose);font-weight:500;line-height:1.5;}
  .kv{display:grid;grid-template-columns:46px 1fr;gap:8px 8px;font-size:15px;line-height:1.6;margin:0;}
  .kv dt{color:var(--ink-faint);} .kv dd{margin:0;}
  .ghost{display:block;width:100%;margin-top:16px;text-align:center;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:12px;font-size:14.5px;font-weight:500;}

  /* 식순 */
  .tl{position:relative;margin:6px 0 0 4px;padding-left:22px;}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .it{position:relative;padding:0 0 18px;transition:opacity .3s;}
  .it::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--gold);}
  .it.now::before{background:var(--rose);border-color:var(--rose);box-shadow:0 0 0 5px rgba(181,84,74,.16);}
  .it.done{opacity:.42;}
  .it .t{font-size:12px;letter-spacing:.06em;color:var(--gold);font-weight:500;}
  .it .n{font-family:'Noto Serif KR',serif;font-size:16.5px;font-weight:500;margin:3px 0;}
  .it .d{font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .tag{display:inline-block;margin-left:7px;font-size:10.5px;background:var(--rose);color:#fff;border-radius:4px;padding:1px 6px;vertical-align:1px;letter-spacing:.06em;}
  .part{display:flex;align-items:center;gap:8px;margin:26px 0 12px;padding:10px 14px;background:var(--paper-2);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;}
  .part:first-of-type{margin-top:14px;}
  .part b{font-family:'Noto Serif KR',serif;font-weight:600;font-size:19px;letter-spacing:.08em;}
  .part span.pt{margin-left:auto;font-size:13px;color:var(--ink-soft);letter-spacing:.04em;}
  .part.on{background:#F6E7E1;border-left-color:var(--rose);}
  .part .tag{margin-left:0;}
  .note{font-size:13px;color:var(--ink-faint);margin:2px 0 6px;}

  /* 우리 이야기 */
  .line{position:relative;margin-left:4px;padding-left:16px;border-left:1px solid var(--line);margin-top:6px;}
  .yr{position:relative;margin-bottom:26px;}
  .yr::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .yr .y{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);line-height:1;margin-bottom:8px;}
  .yr .ph{aspect-ratio:3/2;border-radius:10px;background-size:cover;background-color:var(--paper-2);}
  .yr .x{font-size:15px;line-height:1.85;color:var(--ink);margin-top:10px;}

  /* 안내 */
  .info{display:flex;gap:12px;margin-bottom:20px;}
  .info .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .info b{font-family:'Noto Serif KR',serif;font-weight:500;font-size:16.5px;display:block;}
  .info p{margin:3px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-soft);}
  .info p strong{font-weight:500;color:var(--ink);}
  .sorry{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;color:var(--ink);margin:8px 0 4px;}
  .sorry b{display:inline;font-size:15.5px;}
  .veg{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 6px;}
  .veg span{font-size:11px;padding:2px 7px;border-radius:999px;background:#EAF0E1;border:1px solid #CFDCBF;color:#41552f;}
  .warn{font-size:12px;color:var(--ink-faint);}
  .call{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;text-decoration:none;}
  .call span{font-size:13px;opacity:.88;line-height:1.5;}
  .call b{font-size:17px;letter-spacing:.04em;font-weight:500;color:#fff;}
  .empty-msg{text-align:center;margin-top:18px;font-size:14.5px;line-height:1.85;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="callwrap"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="overlay"></div>

    s += `<circle cx="548" cy="322" r="12" fill="#2E2B24"/><text x="548" y="326" font-size="11" fill="#fff" text-anchor="middle">나</text>`;
    const ly = t.space==='2' ? y+h+22 : y-10;
    s += `<text x="${x+w/2}" y="${ly}" font-size="16" fill="#B5544A" font-weight="700" text-anchor="middle">내 자리</text>`;
  }
  // 터치 영역 (테이블 누르면 자리 상세)
  DATA.tables.forEach(t=>{
    const [x,y,w,h]=t.rect;
    s += `<rect class="tbl-hit" data-table="${t.id}" x="${x-10}" y="${y-10}" width="${w+20}" height="${h+20}" fill="transparent"/>`;
  });
  return s+'</svg>';
}

function render(top){

/* 뒤로가기: 화면 이동마다 기록을 쌓아 앱 안에서 먼저 되돌아가게 */
const snap = () => JSON.stringify([st.tab, st.view, st.who, st.table, st.sheet]);
let curNav = snap();
function pushNav(){ const k = snap(); if(k!==curNav){ curNav=k; try{ history.pushState(JSON.parse(k),''); }catch(e){} } }
window.addEventListener('popstate', e=>{

function matches(q){
  q = q.replace(/\s+/g,'');
  if(!q) return [];
  const m = DATA.guests.filter(g=>g.name.includes(q));
  m.sort((a,b)=> (b.name.startsWith(q)-a.name.startsWith(q)) || (a.name.indexOf(q)-b.name.indexOf(q)) || a.name.localeCompare(b.name,'ko'));
  return m;
}
function hlName(n,q){
  q=q.replace(/\s+/g,''); const i=n.indexOf(q);
  if(i<0) return esc(n);
  return esc(n.slice(0,i))+'<em>'+esc(q)+'</em>'+esc(n.slice(i+q.length));
}
function renderSeat(){
  if(st.view==='result') return renderResult();

      <div id="dyn"></div>

        <button type="button" data-go="info"><b>안내</b><span>식사 · 화장실 등</span></button>
      </div>`;

const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
function nowMin(){
  const q = params.get('t');
  if(q && /^\d{1,2}:\d{2}$/.test(q)) return toMin(q);
  const d = new Date();
  // 예식 당일(한국시간 2026-11-28)만 '지금' 표시
  const kst = new Date(d.getTime() + (d.getTimezoneOffset()+540)*60000);
  const day = kst.getFullYear()*10000 + (kst.getMonth()+1)*100 + kst.getDate();
  if(day < 20261128) return 0;   // 예식 전: 식전 단계로 표시
  if(day > 20261128) return null;
  return kst.getHours()*60 + kst.getMinutes();
}
function renderOrder(keep){
  const now = nowMin();
  const y = $view.scrollTop;
  let h = `<p class="h2">오늘의 식순</p><p class="lead" style="margin-bottom:6px">시간은 조금 달라질 수 있어요.</p>`;
  ORDER.forEach(sec=>{
    const secStart = sec.start ? toMin(sec.start) : null, secEnd = sec.end ? toMin(sec.end) : null;
    const secNow = secStart!=null && now!=null && now>=secStart && now<secEnd;
    const secDone = secEnd!=null && now!=null && now>=secEnd;
    const [pn,pt] = sec.part.split(' · ');
    h += `<div class="part ${secNow?'on':''}" ${pn==='식전'?'id="pre"':''}><b>${pn}</b>${secNow?'<span class="tag">지금</span>':''}<span class="pt">${pt} ~</span></div><div class="tl">`;
    sec.items.forEach(it=>{
      let cls='it', tag='';
      if(sec.start){ if(secDone) cls+=' done'; }
      else if(now!=null){
        const s=toMin(it.start), e=toMin(it.end);
        if(now>=e) cls+=' done'; else if(now>=s){ cls+=' now'; tag='<span class="tag">지금</span>'; }
      }
      h += `<div class="${cls}"><div class="t">${it.t}${tag}</div><div class="n">${it.n}</div>${it.d?`<div class="d">${it.d}</div>`:''}</div>`;
    });
    h += '</div>';
  });
  $view.innerHTML = h;
  if(keep){ $view.scrollTop = y; return; }
  if(st.scrollPre){ st.scrollPre=false; $view.scrollTop=0; return; }
  const target = $view.querySelector('.it.now') || $view.querySelector('.part .tag')?.parentElement;
  $view.scrollTop = target ? Math.max(0, target.offsetTop - 90) : 0;
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-tab],[data-go],[data-pick],[data-table],[data-person]');
  if(!el) return;
  if(el.dataset.tab){ const k=el.dataset.tab; if(k==='seat' && st.tab==='seat'){ st.view = st.who?'result':'home'; st.sheet=null; } st.tab=k; render(true); return; }

});
